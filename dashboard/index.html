<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MIJ@ Dashboard</title>
  <style>
    body { font-family: Arial; background:#0f172a; color:white; }
    h1 { text-align:center; }
    table {
      width: 90%;
      margin:auto;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #334155;
      text-align: center;
    }
    th { background:#1e293b; }
    tr:hover { background:#1e293b; }
    .sent { color:#22c55e; }
    .blocked { color:#f59e0b; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h1>🚨 MIJ@ Dashboard</h1>

<table>
  <thead>
    <tr>
      <th>Paciente</th>
      <th>HR</th>
      <th>Estado</th>
      <th>Hora</th>
      <th>Ubicación</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<h2 style="text-align:center;">📈 Frecuencia Cardíaca</h2>
<canvas id="hrChart" style="max-width:90%; margin:auto;"></canvas>

<script>

const API = "https://mija-alert-backend-production.up.railway.app/api/alerts/history";

async function loadData() {

  try {
    const res = await fetch(API);
    const data = await res.json();

    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    data.forEach(alert => {

      const tr = document.createElement("tr");

      const statusClass = alert.status === "sent" ? "sent" : "blocked";
      const statusText = alert.status === "sent" ? "⚠️ ALERTA" : "⏱️ BLOQUEADA";

      tr.innerHTML = `
        <td>${alert.patientName}</td>
        <td>${alert.hrBpm}</td>
        <td class="${statusClass}">${statusText}</td>
        <td>${new Date(alert.timestamp).toLocaleTimeString()}</td>
        <td>
          ${alert.location ? `<a href="${alert.location}" target="_blank">📍 Ver</a>` : "-"}
        </td>
      `;

      tbody.appendChild(tr);
      buildChart(data);
    });

  } catch (err) {
    console.error("Error cargando datos", err);
  }
}

// refrescar cada 5 segundos
setInterval(loadData, 5000);
loadData();

let chart;

function buildChart(data) {

  const labels = data.map(a => new Date(a.timestamp).toLocaleTimeString());
  const values = data.map(a => a.hrBpm);

  const ctx = document.getElementById("hrChart").getContext("2d");

  if (chart) {
    chart.destroy();
  }

  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        label: "HR (bpm)",
        data: values,
        borderWidth: 2,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: true }
      }
    }
  });
}

</script>

</body>
</html>
